<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121214">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Guitar Tuner">
  <title>Guitar Tuner & Metronome</title>

  <link id="app-icon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%231e1e24'/%3E%3Cg transform='translate(256, 256) rotate(45) translate(-256, -256)'%3E%3Crect x='242' y='70' width='28' height='210' rx='6' fill='%23d4a373'/%3E%3Crect x='236' y='40' width='40' height='45' rx='8' fill='%238d5524'/%3E%3Ccircle cx='228' cy='52' r='6' fill='%23ccc'/%3E%3Ccircle cx='228' cy='72' r='6' fill='%23ccc'/%3E%3Ccircle cx='284' cy='52' r='6' fill='%23ccc'/%3E%3Ccircle cx='284' cy='72' r='6' fill='%23ccc'/%3E%3Cpath d='M256 240 C190 240, 175 295, 200 330 C165 365, 160 450, 256 450 C352 450, 347 365, 312 330 C337 295, 322 240, 256 240 Z' fill='%23e07a5f'/%3E%3Ccircle cx='256' cy='315' r='32' fill='%232b1d0e' stroke='%23f4f1de' stroke-width='5'/%3E%3Crect x='226' y='385' width='60' height='14' rx='4' fill='%233d2b1f'/%3E%3Cline x1='248' y1='75' x2='248' y2='385' stroke='%23ffffffaa' stroke-width='2'/%3E%3Cline x1='256' y1='75' x2='256' y2='385' stroke='%23ffffffaa' stroke-width='2'/%3E%3Cline x1='264' y1='75' x2='264' y2='385' stroke='%23ffffffaa' stroke-width='2'/%3E%3C/g%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --surface: #272730;
      --text: #f4f4f6;
      --muted: #8e8e98;
      --accent: #f59e0b;
      --in-tune: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body > :not(#app) {
      display: none !important;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      user-select: none;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card);
      padding: 4px;
      border-radius: 16px;
      width: 100%;
      border: 1px solid #2c2c35;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      flex: 1;
    }

    .view.active {
      display: flex;
    }

    .card {
      background: var(--card);
      width: 100%;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      border: 1px solid #2c2c35;
    }

    .mode-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .mode-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    .auto-btn {
      background: var(--surface);
      border: 1px solid #383844;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .auto-btn.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: 600;
      height: 24px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .note-display {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      margin: 8px 0;
      color: var(--text);
      transition: color 0.15s ease;
    }

    .note-display.tuned {
      color: var(--in-tune);
      text-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
    }

    .target-hint {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 24px;
      height: 20px;
    }

    .band-wrapper {
      width: 100%;
      padding: 8px 0;
    }

    .band-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .band-labels span.center-lbl {
      color: var(--in-tune);
    }

    .tuning-band {
      position: relative;
      width: 100%;
      height: 36px;
      background: #141418;
      border-radius: 18px;
      border: 1px solid #2c2c35;
      overflow: hidden;
    }

    .in-tune-zone {
      position: absolute;
      left: 40%;
      width: 20%;
      top: 0;
      bottom: 0;
      background: rgba(16, 185, 129, 0.18);
      border-left: 2px solid rgba(16, 185, 129, 0.5);
      border-right: 2px solid rgba(16, 185, 129, 0.5);
    }

    .in-tune-center-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--in-tune);
      transform: translateX(-50%);
    }

    .band-marker {
      position: absolute;
      left: 50%;
      top: 4px;
      bottom: 4px;
      width: 10px;
      background: var(--accent);
      border-radius: 5px;
      transform: translateX(-50%);
      transition: left 0.14s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s, opacity 0.2s;
      opacity: 0.35;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .band-marker.active {
      opacity: 1;
    }

    .band-marker.tuned {
      background: var(--in-tune);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.8);
    }

    .strings-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      width: 100%;
    }

    .string-btn {
      background: var(--card);
      border: 1px solid #2c2c35;
      color: var(--text);
      padding: 16px 0;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .string-btn.selected {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
    }

    .string-btn.tuned {
      border-color: var(--in-tune);
      background: rgba(16, 185, 129, 0.2);
      color: var(--in-tune);
    }

    .action-btn {
      width: 100%;
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      background: var(--accent);
      color: #121214;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
      transition: background 0.15s;
    }

    .action-btn.running {
      background: var(--surface);
      color: var(--text);
      box-shadow: none;
    }

    .bpm-display {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .bpm-label {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .beat-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 20px 0 28px;
      height: 22px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--surface);
      transition: transform 0.08s, background-color 0.08s;
    }

    .dot.active {
      background: var(--accent);
      transform: scale(1.25);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.6);
    }

    .dot.active.accent {
      background: var(--in-tune);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.7);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .step-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #2c2c35;
      background: var(--surface);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
      background: var(--surface);
      border-radius: 4px;
      cursor: pointer;
    }

    .metro-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .opt-btn {
      background: var(--card);
      border: 1px solid #2c2c35;
      color: var(--text);
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .opt-btn:active {
      background: var(--surface);
    }
  </style>
</head>
<body>

  <main id="app">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="tuner">Tuner</button>
      <button class="tab-btn" data-tab="metronome">Metronome</button>
    </div>

    <div class="view active" id="tuner-view">
      <div class="card">
        <div class="mode-row">
          <span class="mode-label" id="mode-label">Mode: Auto</span>
          <button class="auto-btn active" id="auto-btn">Auto (All)</button>
        </div>

        <div class="status-text" id="status">Tap Start to Tune</div>
        <div class="note-display" id="note">--</div>
        <div class="target-hint" id="target-hint">Tap a string below to lock it</div>

        <div class="band-wrapper">
          <div class="band-labels">
            <span>FLAT</span>
            <span class="center-lbl">IN TUNE</span>
            <span>SHARP</span>
          </div>
          <div class="tuning-band">
            <div class="in-tune-zone"></div>
            <div class="in-tune-center-line"></div>
            <div class="band-marker" id="band-marker"></div>
          </div>
        </div>
      </div>

      <div class="strings-grid" id="strings">
        <button class="string-btn" data-freq="82.41" data-midi="40" data-label="E6">E6</button>
        <button class="string-btn" data-freq="110.00" data-midi="45" data-label="A5">A5</button>
        <button class="string-btn" data-freq="146.83" data-midi="50" data-label="D4">D4</button>
        <button class="string-btn" data-freq="196.00" data-midi="55" data-label="G3">G3</button>
        <button class="string-btn" data-freq="246.94" data-midi="59" data-label="B2">B2</button>
        <button class="string-btn" data-freq="329.63" data-midi="64" data-label="E1">E1</button>
      </div>

      <button class="action-btn" id="tuner-btn">Start Microphone</button>
    </div>

    <div class="view" id="metronome-view">
      <div class="card">
        <div class="bpm-display" id="bpm-val">120</div>
        <div class="bpm-label">BPM</div>

        <div class="beat-dots" id="beat-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="slider-row">
          <button class="step-btn" id="bpm-down">-</button>
          <input type="range" id="bpm-slider" min="40" max="240" value="120">
          <button class="step-btn" id="bpm-up">+</button>
        </div>
      </div>

      <div class="metro-options">
        <button class="opt-btn" id="time-sig-btn">Time: 4/4</button>
        <button class="opt-btn" id="tap-btn">Tap Tempo</button>
      </div>

      <button class="action-btn" id="metro-btn">Start Metronome</button>
    </div>
  </main>

  <script>
    const iconSvg = document.getElementById('app-icon').href;
    const manifest = {
      name: "Guitar Tuner",
      short_name: "Tuner",
      start_url: ".",
      display: "standalone",
      background_color: "#121214",
      theme_color: "#121214",
      icons: [{ src: iconSvg, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    const tabBtns = document.querySelectorAll('.tab-btn');
    const views = {
      tuner: document.getElementById('tuner-view'),
      metronome: document.getElementById('metronome-view')
    };

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const target = btn.dataset.tab;
        Object.keys(views).forEach(k => views[k].classList.toggle('active', k === target));
        if (target === 'metronome' && isListening) stopTuner();
        if (target === 'tuner' && isMetroRunning) stopMetronome();
      });
    });

    const guitarStrings = [
      { label: "E6", midi: 40, freq: 82.41 },
      { label: "A5", midi: 45, freq: 110.00 },
      { label: "D4", midi: 50, freq: 146.83 },
      { label: "G3", midi: 55, freq: 196.00 },
      { label: "B2", midi: 59, freq: 246.94 },
      { label: "E1", midi: 64, freq: 329.63 }
    ];

    let analyser = null;
    let micStream = null;
    let isListening = false;
    let selectedString = null;
    let buf = new Float32Array(4096);
    let pitchHistory = [];
    let lastValidTime = 0;

    const tunerBtn = document.getElementById('tuner-btn');
    const autoBtn = document.getElementById('auto-btn');
    const modeLabel = document.getElementById('mode-label');
    const noteEl = document.getElementById('note');
    const targetHintEl = document.getElementById('target-hint');
    const statusEl = document.getElementById('status');
    const markerEl = document.getElementById('band-marker');
    const stringBtns = document.querySelectorAll('.string-btn');

    function playReferenceTone(freq) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.28, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 1.2);
    }

    function setSelectedString(strObj) {
      selectedString = strObj;
      pitchHistory = [];
      stringBtns.forEach(b => {
        b.classList.remove('tuned');
        b.classList.toggle('selected', strObj && parseInt(b.dataset.midi) === strObj.midi);
      });

      if (strObj) {
        autoBtn.classList.remove('active');
        modeLabel.textContent = "Locked String: " + strObj.label;
        noteEl.textContent = strObj.label;
        noteEl.classList.remove('tuned');
        targetHintEl.textContent = "Listening only for " + strObj.label + " (" + strObj.freq.toFixed(1) + " Hz)";
        if (isListening) statusEl.textContent = "Pluck " + strObj.label + "...";
      } else {
        autoBtn.classList.add('active');
        modeLabel.textContent = "Mode: Auto";
        noteEl.textContent = "--";
        noteEl.classList.remove('tuned');
        targetHintEl.textContent = "Tap a string below to lock it";
        if (isListening) statusEl.textContent = "Pluck any string...";
      }
      markerEl.style.left = "50%";
      markerEl.classList.remove('active', 'tuned');
    }

    autoBtn.addEventListener('click', () => setSelectedString(null));

    stringBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const strObj = guitarStrings.find(s => s.midi === parseInt(btn.dataset.midi));
        setSelectedString(strObj);
        playReferenceTone(strObj.freq);
      });
    });

    function stopTuner() {
      isListening = false;
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      tunerBtn.textContent = "Start Microphone";
      tunerBtn.classList.remove('running');
      statusEl.textContent = "Tap Start to Tune";
      statusEl.style.color = 'var(--muted)';
      noteEl.classList.remove('tuned');
      markerEl.classList.remove('active', 'tuned');
    }

    tunerBtn.addEventListener('click', async () => {
      if (isListening) {
        stopTuner();
        return;
      }
      try {
        const ctx = getAudioCtx();
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false }
        });
        const source = ctx.createMediaStreamSource(micStream);
        analyser = ctx.createAnalyser();
        analyser.fftSize = 4096;
        source.connect(analyser);

        isListening = true;
        pitchHistory = [];
        tunerBtn.textContent = "Stop Microphone";
        tunerBtn.classList.add('running');
        statusEl.textContent = selectedString ? "Pluck " + selectedString.label + "..." : "Pluck any string...";
        updatePitch();
      } catch (err) {
        statusEl.textContent = "Microphone access denied";
      }
    });

    function autoCorrelate(buffer, sampleRate) {
      let size = buffer.length;
      let rms = 0;
      for (let i = 0; i < size; i++) rms += buffer[i] * buffer[i];
      rms = Math.sqrt(rms / size);
      if (rms < 0.025) return -1;

      let r1 = 0, r2 = size - 1, thres = 0.2;
      for (let i = 0; i < size / 2; i++) if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < size / 2; i++) if (Math.abs(buffer[size - i]) < thres) { r2 = size - i; break; }

      buffer = buffer.slice(r1, r2);
      size = buffer.length;
      if (size < 64) return -1;

      let c = new Array(size).fill(0);
      for (let i = 0; i < size; i++)
        for (let j = 0; j < size - i; j++)
          c[i] = c[i] + buffer[j] * buffer[j + i];

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < size; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }
      if (maxpos <= 0 || maxpos >= size - 1) return -1;

      let T0 = maxpos;
      let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      let a = (x1 + x3 - 2 * x2) / 2;
      let b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);

      return sampleRate / T0;
    }

    function updatePitch() {
      if (!isListening) return;

      analyser.getFloatTimeDomainData(buf);
      let ac = autoCorrelate(buf, audioCtx.sampleRate);

      if (ac !== -1 && ac > 65 && ac < 420) {
        let detectedMidi = 12 * (Math.log(ac / 440) / Math.log(2)) + 69;

        let targetStr = selectedString;
        if (!targetStr) {
          targetStr = guitarStrings.reduce((prev, curr) =>
            Math.abs(curr.midi - detectedMidi) < Math.abs(prev.midi - detectedMidi) ? curr : prev
          );
        }

        let centsFromTarget = (detectedMidi - targetStr.midi) * 100;

        if (Math.abs(centsFromTarget) <= 450) {
          lastValidTime = performance.now();

          pitchHistory.push(centsFromTarget);
          if (pitchHistory.length > 6) pitchHistory.shift();

          let sorted = [...pitchHistory].sort((a, b) => a - b);
          let smoothedCents = sorted[Math.floor(sorted.length / 2)];

          noteEl.textContent = targetStr.label;
          markerEl.classList.add('active');

          stringBtns.forEach(b => {
            const isThis = parseInt(b.dataset.midi) === targetStr.midi;
            b.classList.toggle('tuned', isThis && Math.abs(smoothedCents) <= 10);
          });

          let clampedCents = Math.max(-50, Math.min(50, smoothedCents));
          markerEl.style.left = (50 + clampedCents) + "%";

          if (Math.abs(smoothedCents) <= 10) {
            noteEl.classList.add('tuned');
            markerEl.classList.add('tuned');
            statusEl.textContent = "In Tune!";
            statusEl.style.color = 'var(--in-tune)';
          } else {
            noteEl.classList.remove('tuned');
            markerEl.classList.remove('tuned');
            statusEl.style.color = 'var(--muted)';
            statusEl.textContent = smoothedCents < 0 ? "Too Flat (Tune Up)" : "Too Sharp (Tune Down)";
          }
        }
      } else if (performance.now() - lastValidTime > 1200) {
        pitchHistory = [];
        markerEl.classList.remove('active', 'tuned');
        noteEl.classList.remove('tuned');
        statusEl.style.color = 'var(--muted)';
        statusEl.textContent = selectedString ? "Pluck " + selectedString.label + "..." : "Pluck any string...";
      }

      requestAnimationFrame(updatePitch);
    }

    let bpm = 120;
    let beatsPerMeasure = 4;
    const timeSigs = [4, 3, 6, 2];
    let timeSigIdx = 0;
    let isMetroRunning = false;
    let currentBeat = 0;
    let nextNoteTime = 0.0;
    let timerID = null;

    const bpmValEl = document.getElementById('bpm-val');
    const bpmSlider = document.getElementById('bpm-slider');
    const beatDotsEl = document.getElementById('beat-dots');
    const metroBtn = document.getElementById('metro-btn');
    const timeSigBtn = document.getElementById('time-sig-btn');
    const tapBtn = document.getElementById('tap-btn');

    function renderDots() {
      beatDotsEl.innerHTML = '';
      for (let i = 0; i < beatsPerMeasure; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        beatDotsEl.appendChild(d);
      }
    }

    function updateBpm(newBpm) {
      bpm = Math.max(40, Math.min(240, newBpm));
      bpmValEl.textContent = bpm;
      bpmSlider.value = bpm;
    }

    bpmSlider.addEventListener('input', e => updateBpm(parseInt(e.target.value)));
    document.getElementById('bpm-down').addEventListener('click', () => updateBpm(bpm - 1));
    document.getElementById('bpm-up').addEventListener('click', () => updateBpm(bpm + 1));

    timeSigBtn.addEventListener('click', () => {
      timeSigIdx = (timeSigIdx + 1) % timeSigs.length;
      beatsPerMeasure = timeSigs[timeSigIdx];
      timeSigBtn.textContent = `Time: ${beatsPerMeasure}/${beatsPerMeasure === 6 ? 8 : 4}`;
      currentBeat = 0;
      renderDots();
    });

    let tapTimes = [];
    tapBtn.addEventListener('click', () => {
      const now = performance.now();
      if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2000) tapTimes = [];
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();
      if (tapTimes.length >= 2) {
        let intervals = [];
        for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1]);
        const avg = intervals.reduce((a, b) => a + b) / intervals.length;
        updateBpm(Math.round(60000 / avg));
      }
    });

    function scheduleNote(beatNumber, time) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(beatNumber === 0 ? 1000 : 750, time);
      gain.gain.setValueAtTime(0.4, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + 0.05);

      const delay = Math.max(0, (time - ctx.currentTime) * 1000);
      setTimeout(() => {
        const dots = beatDotsEl.querySelectorAll('.dot');
        dots.forEach((d, idx) => {
          d.classList.toggle('active', idx === beatNumber);
          d.classList.toggle('accent', idx === 0 && beatNumber === 0);
        });
      }, delay);
    }

    function scheduler() {
      const ctx = getAudioCtx();
      while (nextNoteTime < ctx.currentTime + 0.1) {
        scheduleNote(currentBeat, nextNoteTime);
        nextNoteTime += 60.0 / bpm;
        currentBeat = (currentBeat + 1) % beatsPerMeasure;
      }
      if (isMetroRunning) timerID = setTimeout(scheduler, 25);
    }

    function stopMetronome() {
      isMetroRunning = false;
      clearTimeout(timerID);
      metroBtn.textContent = "Start Metronome";
      metroBtn.classList.remove('running');
      beatDotsEl.querySelectorAll('.dot').forEach(d => d.classList.remove('active', 'accent'));
    }

    metroBtn.addEventListener('click', () => {
      if (isMetroRunning) {
        stopMetronome();
      } else {
        const ctx = getAudioCtx();
        isMetroRunning = true;
        currentBeat = 0;
        nextNoteTime = ctx.currentTime + 0.05;
        metroBtn.textContent = "Stop Metronome";
        metroBtn.classList.add('running');
        scheduler();
      }
    });
  </script>
</body>
</html>
